<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1B1D;
    --panel: #242427;
    --panel-raised: #2C2C30;
    --hairline: #3A3A3E;
    --amber: #E8A33D;
    --amber-dim: #6b5730;
    --teal: #4FB8A6;
    --teal-dim: #2f5f57;
    --red: #D64545;
    --text: #EDEAE3;
    --text-dim: #9A9892;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2a2d 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    justify-content:center;
    padding: 40px 16px;
    min-height: 100vh;
  }

  .device{
    width: 100%;
    max-width: 460px;
  }

  .nameplate{
    text-align:center;
    margin-bottom: 22px;
  }
  .nameplate .id{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
  }
  .nameplate h1{
    font-size: 22px;
    margin: 6px 0 4px;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .nameplate p{
    margin:0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* ---------- Setup screen ---------- */
  .diff-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 18px;
  }
  .diff-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .diff-option:hover{ border-color: var(--amber-dim); }
  .diff-option.selected{
    border-color: var(--amber);
    background: #2f2a20;
  }
  .diff-option .label{
    font-weight: 600;
    font-size: 14px;
  }
  .diff-option .spec{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .diff-option .dot{
    width: 10px; height:10px; border-radius:50%;
    border: 1px solid var(--hairline);
    flex-shrink:0;
    margin-left: 10px;
  }
  .diff-option.selected .dot{
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  button.primary{
    width:100%;
    background: var(--amber);
    color: #1B1B1D;
    border:none;
    border-radius: 10px;
    padding: 13px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor:pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:active{ transform: scale(0.98); }
  button.primary:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }
  button.primary:disabled{ background: var(--hairline); color: var(--text-dim); cursor:not-allowed; }

  button.ghost{
    width:100%;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 11px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
    margin-top: 10px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button.ghost:hover{ border-color: var(--teal); color: var(--teal); }
  button.ghost:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ---------- Gauge ---------- */
  .gauge-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom: 6px;
  }
  .gauge-status{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 6px;
    min-height: 16px;
    text-align:center;
  }
  .gauge-direction{
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    min-height: 30px;
  }
  #needle{
    transform-origin: 150px 150px;
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @media (prefers-reduced-motion: reduce){
    #needle{ transition: none; }
  }

  /* ---------- Lamps (lives) ---------- */
  .lamps-block{ margin: 14px 0; }
  .lamps-label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .lamps{
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .lamp{
    width: 14px; height:14px;
    border-radius:50%;
    background: #17171a;
    border: 1px solid var(--hairline);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .lamp.lit{
    background: var(--amber);
    box-shadow: 0 0 7px var(--amber);
  }
  .lamp.spent{
    background: #17171a;
    border-color: var(--red);
  }

  /* ---------- Readouts ---------- */
  .readouts{
    display:flex;
    gap: 10px;
    margin: 14px 0;
  }
  .readout{
    flex:1;
    background: #17171a;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 9px 10px;
    text-align:center;
  }
  .readout .rlabel{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .readout .rvalue{
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--teal);
    margin-top: 2px;
  }

  /* ---------- Guess input ---------- */
  .guess-row{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  input#guessInput{
    flex:1;
    background: #17171a;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 14px;
    min-width: 0;
  }
  input#guessInput:focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }
  button.submit{
    background: var(--teal);
    color: #10221e;
    border:none;
    border-radius: 10px;
    padding: 0 18px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
    transition: filter 0.15s ease;
  }
  button.submit:hover{ filter: brightness(1.1); }
  button.submit:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

  .hint-line{
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 10px;
    margin-bottom: 10px;
    min-height: 20px;
  }
  .hint-text{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--amber);
    flex:1;
  }
  button.hint-btn{
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  button.hint-btn:hover{ background: rgba(232,163,61,0.1); }

  .error-line{
    color: var(--red);
    font-family: var(--mono);
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 4px;
  }

  /* ---------- Log ---------- */
  .log-label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin: 16px 0 6px;
  }
  .log{
    max-height: 130px;
    overflow-y: auto;
    border-top: 1px solid var(--hairline);
  }
  .log-entry{
    display:flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 2px;
    border-bottom: 1px dashed var(--hairline);
    color: var(--text-dim);
  }
  .log-entry .g{ color: var(--text); }
  .log-entry .verdict.high{ color: var(--red); }
  .log-entry .verdict.low{ color: var(--teal); }

  /* ---------- Round end ---------- */
  .result{
    text-align:center;
    padding: 6px 0 4px;
  }
  .result .headline{
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result.win .headline{ color: var(--amber); }
  .result.lose .headline{ color: var(--red); }
  .result .sub{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .score-big{
    font-family: var(--mono);
    font-size: 42px;
    font-weight: 700;
    color: var(--teal);
    line-height:1;
  }
  .score-cap{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* ---------- Stats ledger ---------- */
  .ledger{
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }
  .ledger-title{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .ledger-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ledger-item{
    display:flex;
    justify-content:space-between;
    font-family: var(--mono);
    font-size: 12px;
  }
  .ledger-item .k{ color: var(--text-dim); }
  .ledger-item .v{ color: var(--text); font-weight: 600; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="device">
  <div class="nameplate">
    <div class="id">N·100 — SIGNAL LOCATOR</div>
    <h1>Find the transmission</h1>
    <p>Tune in before your power cells run out.</p>
  </div>

  <div class="panel">

    <!-- ===== SETUP SCREEN ===== -->
    <div id="setupScreen">
      <div class="diff-row" id="diffRow"></div>
      <button class="primary" id="beginBtn">Begin scan</button>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="gameScreen" class="hidden">
      <div class="gauge-wrap">
        <svg width="300" height="170" viewBox="0 0 300 170">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4FB8A6"/>
              <stop offset="50%" stop-color="#8a8a5a"/>
              <stop offset="100%" stop-color="#E8A33D"/>
            </linearGradient>
          </defs>
          <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round"/>
          <circle cx="150" cy="150" r="10" fill="#17171a" stroke="var(--hairline)"/>
          <line id="needle" x1="150" y1="150" x2="260" y2="150" stroke="#EDEAE3" stroke-width="4" stroke-linecap="round" transform="rotate(180 150 150)"/>
        </svg>
        <div class="gauge-direction" id="gaugeDirection">&nbsp;</div>
        <div class="gauge-status" id="gaugeStatus">Awaiting first reading</div>
      </div>

      <div class="lamps-block">
        <div class="lamps-label">Power cells</div>
        <div class="lamps" id="lamps"></div>
      </div>

      <div class="readouts">
        <div class="readout">
          <div class="rlabel">Attempts</div>
          <div class="rvalue" id="attemptsReadout">0</div>
        </div>
        <div class="readout">
          <div class="rlabel">Range</div>
          <div class="rvalue" id="rangeReadout">1–100</div>
        </div>
      </div>

      <div class="error-line" id="errorLine">&nbsp;</div>
      <div class="guess-row">
        <input id="guessInput" type="text" inputmode="numeric" placeholder="Enter a number" autocomplete="off">
        <button class="submit" id="submitBtn">Lock in</button>
      </div>

      <div class="hint-line">
        <div class="hint-text" id="hintText"></div>
        <button class="hint-btn hidden" id="hintBtn">Request hint</button>
      </div>

      <div class="log-label">Transmission log</div>
      <div class="log" id="log"></div>
    </div>

    <!-- ===== ROUND END SCREEN ===== -->
    <div id="endScreen" class="hidden">
      <div class="result" id="resultBlock">
        <div class="headline" id="resultHeadline"></div>
        <div class="sub" id="resultSub"></div>
        <div class="score-big" id="scoreBig">0</div>
        <div class="score-cap">Points earned</div>
      </div>
      <button class="primary" id="playAgainBtn">Scan again</button>
      <button class="ghost" id="changeDiffBtn">Change difficulty</button>
    </div>

    <!-- ===== LEDGER (always visible once a round has been played) ===== -->
    <div class="ledger hidden" id="ledger">
      <div class="ledger-title">Session ledger</div>
      <div class="ledger-grid">
        <div class="ledger-item"><span class="k">Scans</span><span class="v" id="statGames">0</span></div>
        <div class="ledger-item"><span class="k">Locked / Lost</span><span class="v" id="statWL">0 / 0</span></div>
        <div class="ledger-item"><span class="k">Best score</span><span class="v" id="statBest">0</span></div>
        <div class="ledger-item"><span class="k">Streak</span><span class="v" id="statStreak">0</span></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const DIFFICULTIES = {
    easy:   { label: "Easy",   lives: 10, range: [1,50],  points: 100 },
    medium: { label: "Medium", lives: 7,  range: [1,100], points: 200 },
    hard:   { label: "Hard",   lives: 5,  range: [1,200], points: 300 },
  };

  const stats = {
    games: 0, wins: 0, losses: 0,
    bestScore: 0, currentStreak: 0, bestStreak: 0
  };

  let selectedDiff = 'medium';
  let round = null; // active round state

  // ---------- Elements ----------
  const setupScreen = document.getElementById('setupScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  const diffRow = document.getElementById('diffRow');
  const beginBtn = document.getElementById('beginBtn');
  const needle = document.getElementById('needle');
  const gaugeDirection = document.getElementById('gaugeDirection');
  const gaugeStatus = document.getElementById('gaugeStatus');
  const lampsEl = document.getElementById('lamps');
  const attemptsReadout = document.getElementById('attemptsReadout');
  const rangeReadout = document.getElementById('rangeReadout');
  const guessInput = document.getElementById('guessInput');
  const submitBtn = document.getElementById('submitBtn');
  const errorLine = document.getElementById('errorLine');
  const hintText = document.getElementById('hintText');
  const hintBtn = document.getElementById('hintBtn');
  const logEl = document.getElementById('log');
  const resultBlock = document.getElementById('resultBlock');
  const resultHeadline = document.getElementById('resultHeadline');
  const resultSub = document.getElementById('resultSub');
  const scoreBig = document.getElementById('scoreBig');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const changeDiffBtn = document.getElementById('changeDiffBtn');
  const ledger = document.getElementById('ledger');

  // ---------- Setup screen: difficulty options ----------
  function renderDiffOptions(){
    diffRow.innerHTML = '';
    Object.keys(DIFFICULTIES).forEach(key => {
      const d = DIFFICULTIES[key];
      const opt = document.createElement('div');
      opt.className = 'diff-option' + (key === selectedDiff ? ' selected' : '');
      opt.setAttribute('role','button');
      opt.setAttribute('tabindex','0');
      opt.innerHTML = `
        <div>
          <div class="label">${d.label}</div>
          <div class="spec">${d.range[0]}–${d.range[1]} · ${d.lives} cells</div>
        </div>
        <div class="dot"></div>
      `;
      opt.addEventListener('click', () => { selectedDiff = key; renderDiffOptions(); });
      opt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectedDiff = key; renderDiffOptions(); }
      });
      diffRow.appendChild(opt);
    });
  }
  renderDiffOptions();

  beginBtn.addEventListener('click', startRound);

  // ---------- Round lifecycle ----------
  function startRound(){
    const settings = DIFFICULTIES[selectedDiff];
    round = {
      target: Math.floor(Math.random() * (settings.range[1]-settings.range[0]+1)) + settings.range[0],
      low: settings.range[0],
      high: settings.range[1],
      maxLives: settings.lives,
      lives: settings.lives,
      maxPoints: settings.points,
      guesses: 0,
      hintUsed: false,
      hintOffered: false,
    };

    rangeReadout.textContent = `${round.low}–${round.high}`;
    attemptsReadout.textContent = '0';
    errorLine.textContent = '\u00A0';
    hintText.textContent = '';
    hintBtn.classList.add('hidden');
    logEl.innerHTML = '';
    gaugeDirection.textContent = '\u00A0';
    gaugeStatus.textContent = 'Awaiting first reading';
    needle.setAttribute('transform', 'rotate(180 150 150)');
    renderLamps();

    setupScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    guessInput.value = '';
    guessInput.focus();
  }

  function renderLamps(){
    lampsEl.innerHTML = '';
    for (let i=0; i<round.maxLives; i++){
      const lamp = document.createElement('div');
      lamp.className = 'lamp' + (i < round.lives ? ' lit' : ' spent');
      lampsEl.appendChild(lamp);
    }
  }

  function statusForCloseness(c){
    if (c < 0.15) return 'Faint signal';
    if (c < 0.40) return 'Weak signal';
    if (c < 0.65) return 'Signal strengthening';
    if (c < 0.85) return 'Strong signal';
    return 'Almost locked';
  }

  function submitGuess(){
    const raw = guessInput.value.trim();
    if (!/^-?\d+$/.test(raw)){
      errorLine.textContent = 'Enter a whole number.';
      return;
    }
    const guess = parseInt(raw, 10);
    if (guess < round.low || guess > round.high){
      errorLine.textContent = `Stay within ${round.low}–${round.high}.`;
      return;
    }
    errorLine.textContent = '\u00A0';
    round.guesses += 1;
    attemptsReadout.textContent = round.guesses;

    const distance = Math.abs(guess - round.target);
    const span = round.high - round.low;
    const closeness = 1 - (distance / span);
    const angle = 180 * (1 - closeness);
    needle.setAttribute('transform', `rotate(${angle} 150 150)`);

    if (guess === round.target){
      winRound();
      return;
    }

    round.lives -= 1;
    renderLamps();

    const verdict = guess > round.target ? 'high' : 'low';
    gaugeDirection.textContent = verdict === 'high' ? '\u2193 Aim lower' : '\u2191 Aim higher';
    gaugeStatus.textContent = statusForCloseness(closeness);

    addLogEntry(guess, verdict);

    if (round.lives <= 0){
      loseRound();
      return;
    }

    // Offer a hint once, if struggling
    if (!round.hintUsed && !round.hintOffered && round.guesses >= 2 && round.lives >= 2){
      round.hintOffered = true;
      hintBtn.classList.remove('hidden');
    }

    guessInput.value = '';
    guessInput.focus();
  }

  function addLogEntry(guess, verdict){
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="g">#${round.guesses} → ${guess}</span><span class="verdict ${verdict}">${verdict === 'high' ? 'too high' : 'too low'}</span>`;
    logEl.prepend(entry);
  }

  function giveHint(){
    const options = ['parity', 'multiple', 'range'];
    const type = options[Math.floor(Math.random()*options.length)];
    let text = '';
    if (type === 'parity'){
      text = `Signal reading: the frequency is ${round.target % 2 === 0 ? 'even' : 'odd'}.`;
    } else if (type === 'multiple'){
      const factor = [5,3,2].find(n => round.target % n === 0);
      text = factor ? `Signal reading: divisible by ${factor}.` : `Signal reading: not divisible by 2, 3, or 5.`;
    } else {
      const span = Math.max(2, Math.floor((round.high - round.low)/4));
      const lo = Math.max(round.low, round.target - (1 + Math.floor(Math.random()*span)));
      const hi = Math.min(round.high, round.target + (1 + Math.floor(Math.random()*span)));
      text = `Signal reading: between ${lo} and ${hi}.`;
    }
    hintText.textContent = text;
    round.hintUsed = true;
    hintBtn.classList.add('hidden');
  }
  hintBtn.addEventListener('click', giveHint);

  function winRound(){
    let score = Math.round((round.lives / round.maxLives) * round.maxPoints);
    if (round.hintUsed) score = Math.round(score * 0.75);

    stats.games += 1;
    stats.wins += 1;
    stats.bestScore = Math.max(stats.bestScore, score);
    stats.currentStreak += 1;
    stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);

    resultBlock.className = 'result win';
    resultHeadline.textContent = 'Transmission locked';
    resultSub.textContent = `The frequency was ${round.target}, found in ${round.guesses} attempt${round.guesses===1?'':'s'}.`;
    scoreBig.textContent = score;
    showEndScreen();
  }

  function loseRound(){
    stats.games += 1;
    stats.losses += 1;
    stats.currentStreak = 0;

    resultBlock.className = 'result lose';
    resultHeadline.textContent = 'Power depleted';
    resultSub.textContent = `The frequency was ${round.target}. Out of power cells.`;
    scoreBig.textContent = 0;
    showEndScreen();
  }

  function showEndScreen(){
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    ledger.classList.remove('hidden');
    document.getElementById('statGames').textContent = stats.games;
    document.getElementById('statWL').textContent = `${stats.wins} / ${stats.losses}`;
    document.getElementById('statBest').textContent = stats.bestScore;
    document.getElementById('statStreak').textContent = `${stats.currentStreak} (best ${stats.bestStreak})`;
  }

  playAgainBtn.addEventListener('click', startRound);
  changeDiffBtn.addEventListener('click', () => {
    endScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
    renderDiffOptions();
  });

  submitBtn.addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitGuess();
  });
})();
</script>

</body>
</html>
